server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-src 'self' https: http://localhost:* http://127.0.0.1:*; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; img-src 'self' data: blob: https:; font-src 'self' data: https:;";
        add_header X-XSS-Protection "1; mode=block";
      	add_header X-Frame-Options "SAMEORIGIN";
      	add_header X-Content-Type-Options nosniff;
      	add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

}
